name: Set up library build
description: Install the JVM runtimes and restore Gradle and Kotlin Native caches.
inputs:
  cache-encryption-key:
    description: Encryption key for the Gradle configuration cache
    required: false
  gradle-cache-read-only:
    description: Restore Gradle User Home without saving publication-job state
    default: 'false'
  target-profile:
    description: Separate cached Native and configuration state for normal and full targets
    default: default
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: |
          17
          25
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
    - uses: actions/cache@v6
      with:
        path: ~/.konan
        key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ inputs.target-profile }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/*.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-konan-${{ inputs.target-profile }}-
          ${{ runner.os }}-${{ runner.arch }}-konan-
    # setup-gradle v6 caches Gradle User Home; persist project entries explicitly.
    # GRADLE_ENCRYPTION_KEY is exported by setup-gradle and Gradle encrypts these files.
    - name: Cache encrypted configuration state
      if: ${{ inputs.cache-encryption-key != '' }}
      uses: actions/cache@v6
      with:
        path: |
          .gradle/configuration-cache
          consumer/.gradle/configuration-cache
        key: ${{ runner.os }}-${{ runner.arch }}-configuration-${{ inputs.target-profile }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-configuration-${{ inputs.target-profile }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-
