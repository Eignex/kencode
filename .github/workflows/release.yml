name: release

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: Run the release build and publish nothing
        type: boolean
        default: false

permissions:
  contents: read

# New snapshots supersede older runs; a tag publication must never be cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    name: Resolve publication version and revision
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve publication version
        id: version
        env:
          DRY_RUN: ${{ inputs.dryRun || false }}
        run: |
          next_patch() {
            local tag major minor patch
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                major=${BASH_REMATCH[1]}
                minor=${BASH_REMATCH[2]}
                patch=${BASH_REMATCH[3]}
                printf '%s.%s.%s\n' "$major" "$minor" "$((10#$patch + 1))"
                return
              fi
            done < <(git tag --list 'v*' --sort=-v:refname)
            echo '0.0.1'
          }
          if [[ "$DRY_RUN" == true ]]; then
            version=$(next_patch)
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version="$(next_patch)-SNAPSHOT"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid publication version: $version" >&2
            exit 1
          fi
          is_snapshot=false
          [[ "$version" != *-SNAPSHOT ]] || is_snapshot=true
          is_prerelease=false
          [[ "$version" != *-* ]] || is_prerelease=true
          {
            echo "version=$version"
            echo "is_snapshot=$is_snapshot"
            echo "is_prerelease=$is_prerelease"
            echo "dry_run=$DRY_RUN"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # Tags and manual runs use the same gate as pull requests. Automatic snapshots have already passed it.
  validate:
    if: github.event_name != 'workflow_run'
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.validate.result == 'success' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      IS_SNAPSHOT: ${{ needs.prepare.outputs.is_snapshot }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Restore Kotlin/Native toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Build and Test
        if: env.IS_SNAPSHOT == 'false'
        run: ./gradlew build -PciVersion="$RELEASE_VERSION"
      - name: Upload test reports
        if: always() && env.IS_SNAPSHOT == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
      - name: Publish to Maven Central (Portal)
        if: env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral -PciVersion="$RELEASE_VERSION"
      - name: Publish to Sonatype Snapshots
        if: env.IS_SNAPSHOT == 'true' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToSonatypeSnapshotsRepository -PciVersion="$RELEASE_VERSION"
      - name: Create GitHub release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          generate_release_notes: true
