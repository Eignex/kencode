name: release

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    name: Resolve publication version and revision
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
      test_release: ${{ steps.version.outputs.test_release }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve publication version
        id: version
        shell: bash
        run: |
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          is_snapshot=false
          test_release=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v${core}(-rc\.(0|[1-9][0-9]*))?$ ]]; then
              echo '::error::Use a vX.Y.Z or vX.Y.Z-rc.N release tag' >&2
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
            if [[ "$version" == *-rc.* ]]; then test_release=true; fi
          elif [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" == main ]]; then
            version=0.0.1-SNAPSHOT
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v${core}$ ]]; then
                version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-SNAPSHOT"
                break
              fi
            done < <(git tag --list 'v*' --sort=-v:refname)
            is_snapshot=true
          else
            echo '::error::Releases require a version tag; snapshots use main' >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "is_snapshot=$is_snapshot"
            echo "test_release=$test_release"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # Tagged releases rerun Linux checks alongside Windows and macOS/iOS.
  validate:
    if: github.event_name != 'workflow_run'
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      ciVersion: ${{ needs.prepare.outputs.version }}
      fullTargets: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.validate.result == 'success' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HAS_CONFIGURATION_CACHE: ${{ secrets.GRADLE_ENCRYPTION_KEY != '' }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      IS_SNAPSHOT: ${{ needs.prepare.outputs.is_snapshot }}
      IS_TEST_RELEASE: ${{ needs.prepare.outputs.test_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # kbuild 1.3.6 requires Java 21; library compilation and tests use 17.
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Restore Kotlin Native
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-full-${{ hashFiles('*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-
      - name: Restore encrypted configuration state
        if: env.HAS_CONFIGURATION_CACHE == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .gradle/configuration-cache
          key: ${{ runner.os }}-${{ runner.arch }}-configuration-full-${{ hashFiles('*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-configuration-full-${{ hashFiles('*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Publish RC to GitHub only
        if: env.IS_TEST_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew publishToGitHubRelease -Ptargets.full -PciVersion="$RELEASE_VERSION"
      - name: Publish stable release to Maven Central
        if: env.IS_SNAPSHOT == 'false' && env.IS_TEST_RELEASE != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral -Ptargets.full -PciVersion="$RELEASE_VERSION"
      - name: Publish snapshot to Sonatype
        if: env.IS_SNAPSHOT == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToSonatypeSnapshotsRepository -Ptargets.full -PciVersion="$RELEASE_VERSION"
      - name: Create GitHub release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false' && env.IS_TEST_RELEASE != 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
