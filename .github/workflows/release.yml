name: release

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

# New snapshots supersede older runs; a tag publication must never be cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    name: Resolve publication version and revision
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      test_release: ${{ steps.version.outputs.test_release }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve publication version
        id: version
        run: python3 .github/scripts/release-version.py

  # Releases rerun Linux checks at the release version alongside macOS/iOS and Windows.
  # Publication waits for every platform. Snapshots reuse the normal main build.
  validate:
    if: github.event_name != 'workflow_run'
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      ciVersion: ${{ needs.prepare.outputs.version }}
      fullTargets: true
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.validate.result == 'success' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      IS_SNAPSHOT: ${{ needs.prepare.outputs.is_snapshot }}
      IS_TEST_RELEASE: ${{ needs.prepare.outputs.test_release }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-cache-read-only: 'true'
          target-profile: full

      # The reusable validation job already ran the full checks and uploaded test reports.
      # Recheck the publication job's staged artifacts and consumer resolution before publishing.
      - name: Verify release publication
        if: env.IS_SNAPSHOT == 'false'
        run: |
          ./gradlew publishAllPublicationsToLocalStagingRepository -Ptargets.full -PciVersion="$RELEASE_VERSION"
          python3 .github/scripts/verify-publication.py build/staging-repo "$RELEASE_VERSION" --full
          bash .github/scripts/verify-consumer.sh "$RELEASE_VERSION"
      - name: Stage and verify GitHub RC assets
        if: env.IS_TEST_RELEASE == 'true'
        run: |
          ./gradlew githubReleaseAssets -Ptargets.full -PciVersion="$RELEASE_VERSION"
          python3 .github/scripts/verify-publication.py build/github-release-assets "$RELEASE_VERSION" --full --github
          bash .github/scripts/verify-consumer.sh "$RELEASE_VERSION" "$PWD/build/github-release-assets"
      - name: Upload validated RC assets for inspection
        if: env.IS_TEST_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-release-assets
          path: build/github-release-assets/
          if-no-files-found: error
      - name: Publish RC to GitHub only
        if: env.IS_TEST_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew publishToGitHubRelease -Ptargets.full -PciVersion="$RELEASE_VERSION"
      - name: Verify anonymous consumer from GitHub
        if: env.IS_TEST_RELEASE == 'true'
        run: >-
          ./gradlew -p consumer run -Pconsumer.version="$RELEASE_VERSION"
          -Pconsumer.githubRepository="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
      - name: Publish to Maven Central (Portal)
        if: env.IS_SNAPSHOT == 'false' && env.IS_TEST_RELEASE != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral -Ptargets.full -PciVersion="$RELEASE_VERSION"
      - name: Publish to Sonatype Snapshots
        if: env.IS_SNAPSHOT == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToSonatypeSnapshotsRepository -Ptargets.full -PciVersion="$RELEASE_VERSION"
      - name: Create GitHub release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false' && env.IS_TEST_RELEASE != 'true'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          generate_release_notes: true
